<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Challenge - Register</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #5f72bd, #7b8fe6, #4f5fa8);
            overflow: hidden;
        }

        /* Floating circles */

        body::before {
            content: "";
            position: absolute;
            width: 220px;
            height: 220px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 50%;
            top: -70px;
            left: -60px;
        }

        body::after {
            content: "";
            position: absolute;
            width: 280px;
            height: 280px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            bottom: -90px;
            right: -70px;
        }

        .container {
            width: 380px;
            padding: 35px;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            color: white;
            z-index: 1;
        }

        .logo {
            font-size: 50px;
            text-align: center;
            margin-bottom: 10px;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            font-weight: bold;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-size: 15px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: none;
            outline: none;
            border-radius: 12px;
            font-size: 15px;
            background: rgba(255, 255, 255, 0.9);
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 12px;
            background: #4b56d2;
            color: white;
            font-size: 17px;
            cursor: pointer;
            transition: .3s;
            font-weight: bold;
        }

        button:hover {
            background: #3643c2;
            transform: scale(1.03);
        }

        .login {
            text-align: center;
            margin-top: 18px;
            font-size: 15px;
        }

        .login a {
            color: #fff;
            text-decoration: none;
            font-weight: bold;
        }

        .login a:hover {
            text-decoration: underline;
        }
    </style>

</head>

<body>

    <div class="container">

        <div class="logo"></div>

        <h2>Create Account</h2>

        <form action="/registration" method="POST">

            <label>Full Name</label>
            <input type="text" name="name" placeholder="Enter your full name" required>

            <label>Email Address</label>
            <input type="email" name="email" placeholder="Enter your email" required>

            <label>Password</label>
            <input type="password" name="password" placeholder="Enter password" required>

            <label>Confirm Password</label>
            <input type="password" name="confirm_password" placeholder="Confirm password" required>

            <!-- <a href="/login">
                <button type="submit">Register</button>
            </a> -->
            <button type="submit">Register</button>

        </form>

        <div class="login">
            Already have an account?
            <a href="/login">Login</a>
        </div>

    </div>

</body>

</html>
