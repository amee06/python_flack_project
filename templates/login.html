<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Speed Game - Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #4b6cb7, #6f86d6, #3f51b5);
            overflow: hidden;
        }

        /* Background Circles */

        body::before {
            content: "";
            position: absolute;
            width: 250px;
            height: 250px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            top: -80px;
            left: -80px;
        }

        body::after {
            content: "";
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            bottom: -100px;
            right: -100px;
        }

        /* Login Card */

        .container {
            width: 390px;
            padding: 35px;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(18px);
            box-shadow: 0 25px 45px rgba(0, 0, 0, .30);
            transform: perspective(1000px) rotateX(5deg);
            transition: .4s;
        }

        .container:hover {
            transform: perspective(1000px) rotateX(0deg) scale(1.02);
        }

        .logo {
            font-size: 55px;
            text-align: center;
            margin-bottom: 10px;
        }

        h2 {
            text-align: center;
            color: white;
            margin-bottom: 25px;
        }

        label {
            display: block;
            color: white;
            margin-bottom: 6px;
            margin-top: 15px;
            font-size: 15px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 12px;
            outline: none;
            font-size: 15px;
            background: rgba(255, 255, 255, .9);
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            border: none;
            border-radius: 12px;
            background: #2f80ed;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: .3s;
            box-shadow: 0 10px 20px rgba(0, 0, 0, .25);
        }

        button:hover {
            transform: translateY(-3px);
            background: #1d63c6;
        }

        .register {
            margin-top: 18px;
            text-align: center;
            color: white;
        }

        .register a {
            color: #fff;
            font-weight: bold;
            text-decoration: none;
        }

        .register a:hover {
            text-decoration: underline;
        }
    </style>

</head>

<body>

    <div class="container">

        <div class="logo">⌨️</div>

        <h2>Typing Speed Game</h2>

        <form action="/login" method="POST">

            <label>Email Address</label>
            <input type="email" name="email" placeholder="Enter your email" required>

            <label>Password</label>
            <input type="password" name="password" placeholder="Enter your password" required>

            <button type="submit">Login</button>

        </form>

        <div class="register">
            Don't have an account?
            <a href="/register">Register</a>
        </div>

    </div>

</body>

</html>
