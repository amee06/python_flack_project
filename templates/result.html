<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Test Result</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #5b4bdb, #3b82f6);
            overflow: hidden;
        }

        body::before {
            content: "";
            position: absolute;
            width: 280px;
            height: 280px;
            background: rgba(255, 255, 255, .08);
            border-radius: 50%;
            top: -80px;
            left: -80px;
        }

        body::after {
            content: "";
            position: absolute;
            width: 320px;
            height: 320px;
            background: rgba(255, 255, 255, .08);
            border-radius: 50%;
            bottom: -100px;
            right: -100px;
        }

        .container {
            width: 500px;
            padding: 35px;
            background: rgba(255, 255, 255, .12);
            backdrop-filter: blur(18px);
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, .3);
            text-align: center;
            color: white;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 30px;
        }

        .result-box {
            background: rgba(255, 255, 255, .15);
            padding: 18px;
            margin: 15px 0;
            border-radius: 15px;
            font-size: 22px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }

        .play-btn {
            display: inline-block;
            margin-top: 30px;
            padding: 15px 40px;
            background: #FFD43B;
            color: #333;
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
            border-radius: 15px;
            transition: .3s;
        }

        .play-btn:hover {
            background: #FFC107;
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255, 212, 59, .6);
        }
    </style>

</head>

<body>

    <div class="container">

        <h1>🏆 Typing Test Result</h1>

        <div class="result-box">
            <span>✅ Correct</span>
            <span>{{ correct }}</span>
        </div>

        <div class="result-box">
            <span>❌ Wrong</span>
            <span>{{ wrong }}</span>
        </div>

        <div class="result-box">
            <span>🎯 Accuracy</span>
            <span>{{ "%.2f"|format(accuracy) }}%</span>
        </div>

        <div class="result-box">
            <span>⚡ WPM</span>
            <span>{{ wpm }}</span>
        </div>

        <a href="/dashboard" class="play-btn">
            🔄 Play Again
        </a>

    </div>

</body>

</html>
