
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', sans-serif;
    }

    body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #5b4bdb, #3b82f6);
        overflow: hidden;
    }

    /* =========================
       Background Circles
    ========================= */

    body::before {
        content: "";
        position: absolute;
        width: 280px;
        height: 280px;
        background: rgba(255, 255, 255, .08);
        border-radius: 50%;
        top: -80px;
        left: -80px;
    }

    body::after {
        content: "";
        position: absolute;
        width: 320px;
        height: 320px;
        background: rgba(255, 255, 255, .08);
        border-radius: 50%;
        bottom: -100px;
        right: -100px;
    }

    /* =========================
       Main Container
    ========================= */

    .container {
        width: 900px;
        background: rgba(255, 255, 255, .12);
        backdrop-filter: blur(18px);
        border-radius: 25px;
        padding: 35px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, .3);
        color: white;
    }

    /* =========================
       Header
    ========================= */

    .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 25px;
    }

    .header h1 {
        font-size: 32px;
    }

    .timer {
        background: #ff4d6d;
        padding: 10px 22px;
        border-radius: 30px;
        font-size: 22px;
        font-weight: bold;
        box-shadow: 0 5px 15px rgba(255, 77, 109, .4);
    }

    /* =========================
       Paragraph
    ========================= */

    .paragraph {
        background: rgba(255, 255, 255, .15);
        padding: 20px;
        border-radius: 15px;
        line-height: 1.8;
        font-size: 18px;
        margin-bottom: 25px;

        user-select: none;
        -webkit-user-select: none;

        height: 130px;
        overflow-y: auto;
    }

    /* =========================
       Individual Words
    ========================= */

    .word {
        display: inline-block;
        margin-right: 7px;
        padding: 2px 4px;
        border-radius: 5px;
        transition: all 0.15s ease;
    }

    /* Current Word */

    .word.current {
        background: rgba(255, 255, 255, 0.25);
        box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
    }

    /* Correct Word */

    .word.correct {
        color: #39ff88;
        background: rgba(57, 255, 136, 0.12);
    }

    /* Wrong Word */

    .word.wrong {
        color: #ff4d6d;
        background: rgba(255, 77, 109, 0.15);
    }

    /* Current Word While Typing */

    .word.typing {
        color: #ffd43b;
        background: rgba(255, 212, 59, 0.15);
    }

    /* =========================
       Textarea
    ========================= */

    textarea {
        width: 100%;
        height: 180px;

        padding: 18px;

        border: none;
        border-radius: 15px;

        font-size: 17px;

        outline: none;
        resize: none;

        margin-bottom: 25px;

        /* Prevent selecting typed text */
        user-select: none;
        -webkit-user-select: none;
    }

    textarea:focus {
        box-shadow: 0 0 0 3px rgba(255, 212, 59, 0.5);
    }

    /* =========================
       Submit Button
    ========================= */

    button {
        width: 100%;
        padding: 16px;
        border: none;
        border-radius: 15px;
        background: #FFD43B;
        font-size: 20px;
        font-weight: bold;
        cursor: pointer;
        transition: .3s;
    }

    button:hover {
        transform: scale(1.03);
        background: #FFC107;
    }
</style>


<!-- =========================
     Main Container
========================= -->

<div class="container">

    <!-- Header -->

    <div class="header">

        <h1>⌨️ Typing Speed Challenge</h1>

        <div class="timer">
            ⏱ <span id="timer"></span>
        </div>

    </div>


    <!-- =========================
         Typing Form
    ========================= -->

    <form action="/result" method="POST" id="typingForm">

        <!-- Paragraph -->

        <div class="paragraph" id="paragraph"></div>


        <!-- Typing Area -->

        <textarea
            id="typingArea"
            name="typed_text"
            placeholder="Start typing the paragraph here..."
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
            required
        ></textarea>


        <!-- Hidden Paragraph -->

        <input
            type="hidden"
            name="paragraph"
            value="{{ paragraph }}"
        >


        <!-- Hidden Duration -->

        <input
            type="hidden"
            name="duration"
            value="{{ duration }}"
        >


        <!-- Submit Button -->

        <button type="submit">
            🚀 Submit Test
        </button>

    </form>

</div>


<script>

    /* =========================
       PARAGRAPH
    ========================= */

    const originalText = {{ paragraph | tojson }};

    const paragraphElement = document.getElementById("paragraph");
    const typingArea = document.getElementById("typingArea");
    const timer = document.getElementById("timer");
    const typingForm = document.getElementById("typingForm");

    const originalWords = originalText.trim().split(/\s+/);


    /* Create paragraph words */

    originalWords.forEach(function(word, index) {

        const span = document.createElement("span");

        span.className = "word";
        span.textContent = word;
        span.dataset.index = index;

        paragraphElement.appendChild(span);

    });

    const wordElements = document.querySelectorAll(".word");


    /* =========================
       PREVENT GOING BACK
    ========================= */

    typingArea.addEventListener("keydown", function(event) {

        const forbiddenKeys = [
            "Backspace",
            "Delete",
            "ArrowLeft",
            "ArrowRight",
            "ArrowUp",
            "ArrowDown",
            "Home",
            "End"
        ];

        const forbiddenCtrlKeys = ["a", "x", "v", "z"];


        if (
            forbiddenKeys.includes(event.key) ||
            (
                event.ctrlKey &&
                forbiddenCtrlKeys.includes(event.key.toLowerCase())
            )
        ) {
            event.preventDefault();
        }

    });


    /* Prevent paste and cut */

    typingArea.addEventListener("paste", function(event) {
        event.preventDefault();
    });

    typingArea.addEventListener("cut", function(event) {
        event.preventDefault();
    });


    /* =========================
       CHECK TYPING
    ========================= */

    typingArea.addEventListener("input", function() {

        const typedText = typingArea.value;

        if (typedText.trim() === "") {

            wordElements.forEach(function(word) {
                word.className = "word";
            });

            return;
        }


        const typedWords = typedText.trim().split(/\s+/);

        const currentIndex = typedWords.length - 1;


        wordElements.forEach(function(wordElement, index) {

            wordElement.className = "word";


            /* Already typed words */

            if (index < currentIndex) {

                if (typedWords[index] === originalWords[index]) {
                    wordElement.classList.add("correct");
                } else {
                    wordElement.classList.add("wrong");
                }

            }


            /* Current word */

            else if (index === currentIndex) {

                const typedWord = typedWords[index];
                const originalWord = originalWords[index];


                if (typedWord === originalWord) {

                    wordElement.classList.add("correct");

                }
                else if (originalWord.startsWith(typedWord)) {

                    wordElement.classList.add("typing");

                }
                else {

                    wordElement.classList.add("wrong");

                }

                wordElement.classList.add("current");

            }

        });


        /* Scroll to current word */

        if (wordElements[currentIndex]) {

            wordElements[currentIndex].scrollIntoView({
                behavior: "smooth",
                block: "center"
            });

        }

    });


    /* =========================
       KEEP CURSOR AT END
    ========================= */

    function moveCursorToEnd() {

        typingArea.setSelectionRange(
            typingArea.value.length,
            typingArea.value.length
        );

    }

    typingArea.addEventListener("click", moveCursorToEnd);
    typingArea.addEventListener("mouseup", moveCursorToEnd);


    /* =========================
       TIMER
    ========================= */

    let time = Number("{{ duration }}") * 60;


    function showTime() {

        const minutes = Math.floor(time / 60);
        const seconds = time % 60;

        timer.innerHTML =
            minutes + ":" +
            (seconds < 10 ? "0" : "") +
            seconds;

    }


    /* Show timer immediately */

    showTime();


    /* Start countdown */

    const countdown = setInterval(function() {

        time--;

        if (time < 0) {

            clearInterval(countdown);
            typingForm.submit();

            return;

        }

        showTime();

    }, 1000);

</script>
